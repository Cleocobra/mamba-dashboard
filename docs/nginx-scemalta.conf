# scemalta.com.br → mesmo container do dashboard (rede docker mamba_proxy).
# Colocar no nginx central (leadspanel-nginx-1), ao lado do server do dashboard.
# O middleware do app usa o header Host para servir o site público na raiz
# deste domínio (SCEMALTA_HOST=scemalta.com.br no .env).

server {
    listen 80;
    listen [::]:80;
    server_name scemalta.com.br www.scemalta.com.br;

    # Validação do Let's Encrypt (ajuste o root se o certbot usar outro caminho)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://scemalta.com.br$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scemalta.com.br www.scemalta.com.br;

    ssl_certificate     /etc/letsencrypt/live/scemalta.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scemalta.com.br/privkey.pem;

    # www → raiz
    if ($host = www.scemalta.com.br) { return 301 https://scemalta.com.br$request_uri; }

    client_max_body_size 10m;

    location / {
        proxy_pass         http://mamba-dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;   # obrigatório: o app decide pelo Host
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;   # /api/scemalta/run pode levar alguns minutos (Claude)
        proxy_send_timeout 300s;
    }
}
