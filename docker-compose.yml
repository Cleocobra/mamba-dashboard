# Dashboard isolado em rede própria (${APP_SLUG}_proxy).
# O nginx central (leadspanel-nginx-1) é anexado a essa rede e faz proxy_pass
# para http://${APP_SLUG}-dashboard:3000. Redis é self-hosted, sem dependência de nuvem.
#
# White-label: defina no .env da instância —
#   APP_SLUG=minhaloja                       (nomes de container/rede/volume)
#   NEXT_PUBLIC_STORE_NAME=Minha Loja        (marca exibida na UI)
#   NEXT_PUBLIC_STORE_LOGO=/logo-minhaloja.png  (arquivo em public/, pode ser untracked)
# Sem nada definido, mantém os nomes/marca Mamba originais.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME:-}
        NEXT_PUBLIC_STORE_LOGO: ${NEXT_PUBLIC_STORE_LOGO:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    image: ${APP_SLUG:-mamba}-dashboard
    container_name: ${APP_SLUG:-mamba}-dashboard
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://${APP_SLUG:-mamba}-redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ${APP_SLUG:-mamba}-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
    name: ${APP_SLUG:-mamba}_redis_data

networks:
  proxy:
    name: ${APP_SLUG:-mamba}_proxy
