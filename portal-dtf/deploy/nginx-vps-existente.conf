# Use este arquivo só se o servidor já tiver um nginx nas portas 80/443 (COMPOSE_PROFILES vazio).
# Conecte o nginx à rede "portaldtf" (docker network connect portaldtf <container-do-nginx>)
# e emita o certificado com o certbot como já faz para os outros sites.
server {
    listen 80;
    server_name portaldtf.com.br www.portaldtf.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://portaldtf.com.br$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name portaldtf.com.br www.portaldtf.com.br;
    ssl_certificate     /etc/letsencrypt/live/portaldtf.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portaldtf.com.br/privkey.pem;
    if ($host = www.portaldtf.com.br) { return 301 https://portaldtf.com.br$request_uri; }
    location / {
        proxy_pass         http://portaldtf-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }
}
